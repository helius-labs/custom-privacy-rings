[package]
name = "zk-ring-program"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["insecure-test-setup"]
insecure-test-setup = []
bpf-entrypoint = []
circuits = ["dep:borsh", "dep:xark", "dep:solana-instruction", "spr-program/client"]
build-circuits = ["spr-program/build"]

[dependencies]
borsh = { workspace = true, optional = true }
pinocchio = { workspace = true, features = ["cpi"] }
solana-instruction = { workspace = true, optional = true }
spr-hasher = { workspace = true }
spr-program = { workspace = true, features = ["compression", "verifier"] }
xark = { version = "0.3.1", optional = true }

[target.'cfg(all(not(xark), not(xark_client)))'.dependencies]
custom-ring-interface = { path = "../../program-libs/interface", default-features = false, features = ["cpi"] }

[dev-dependencies]
async-trait = { workspace = true }
bytemuck = { workspace = true }
solana-account = { workspace = true }
solana-address = { workspace = true }
spr-client = { workspace = true }
spr-interface = { workspace = true }
spr-keypair = { workspace = true }
spr-transaction = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
zolana-ring-client = { workspace = true, features = ["operations"] }
zolana-ring-keys = { workspace = true }

[[test]]
name = "program_commitment"
required-features = ["circuits"]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(xark)',
    'cfg(xark_client)',
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("wasm"))',
]
