[package]
name = "custom-ring-test-validator"
version = "0.1.0"
edition.workspace = true
publish = false
autotests = false

[features]
proofs = [
    "zolana-ring-client/proofs",
    "dep:borsh",
    "dep:xark",
    "dep:zk-ring-program",
    "spr-program/client",
]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bincode = { workspace = true }
borsh = { workspace = true, optional = true }
custom-ring-cli = { workspace = true }
custom-ring-interface = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
solana-address = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-loader-v3-interface = { workspace = true, features = ["wincode"] }
solana-message = { workspace = true }
solana-signature = { workspace = true }
solana-signer = { workspace = true }
solana-system-interface = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
# `serde` is what makes `Transaction`/`VersionedTransaction` serializable for the
# RPC send path; declared here rather than inherited from another crate's features.
spr-client = { workspace = true, features = ["solana-rpc"] }
# `solana` pulls in the ring deposit instruction-data types (`RingAssetDeposit`,
# `DepositAsset`) the lifecycle builds its deposits from.
spr-interface = { workspace = true }
spr-program = { workspace = true }
spr-protocol-instructions = { workspace = true }
spr-keypair = { workspace = true }
spr-program-test = { workspace = true, features = ["localnet"] }
zolana-operator-custody.workspace = true
xark = { version = "0.3.1", optional = true }
zk-ring-program = { path = "../zk-ring-program", features = ["circuits"], optional = true }
zolana-ring-client = { workspace = true, features = ["operations", "solana-rpc"] }
zolana-ring-indexer = { workspace = true }
zolana-ring-keys = { workspace = true }
zolana-ring-policy = { workspace = true }
zolana-ring-rpc = { workspace = true, features = ["surfpool-fixture", "test-fixtures"] }
zolana-ring-transaction = { workspace = true }
spr-test-utils = { workspace = true }
spr-transaction = { workspace = true }
spr-tree = { workspace = true }
spr-user-registry-interface = { workspace = true, features = ["solana"] }

[dev-dependencies]
base64 = { workspace = true }
bytemuck = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
solana-account = { workspace = true }
solana-transaction-status-client-types = { workspace = true }
spr-api = { workspace = true, features = ["reqwest"] }
spr-indexer-api = { workspace = true }
zolana-ring-member-registry = { workspace = true }
solana-rpc-client-api = { workspace = true }
spr-hasher = { workspace = true }
zeroize = { workspace = true }

[[test]]
name = "ring"
path = "tests/ring.rs"

[[test]]
name = "shared_sources"
path = "tests/shared_sources.rs"

[[test]]
name = "policy_rules"
path = "tests/policy_rules.rs"

[[test]]
name = "policy_repin"
path = "tests/policy_repin.rs"

