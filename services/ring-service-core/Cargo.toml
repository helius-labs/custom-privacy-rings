[package]
name = "ring-service-core"
version = "0.1.0"
description = "Store, authorization, limits and chain access shared by the ring services."
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true

[features]
test-fixtures = ["zolana-operator-custody/test-fixtures"]
# Reads Surfpool's local history, opted in at runtime by `ZOLANA_RING_SURFPOOL_FIXTURE=1`.
surfpool-fixture = []

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
bs58 = { workspace = true }
bytemuck = { workspace = true }
clap = { workspace = true }
custom-ring-interface = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
hyper = { workspace = true }
jsonrpsee = { workspace = true }
log = { workspace = true }
p256 = { workspace = true }
psl = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true, features = ["sqlx-sqlite"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
solana-account = { workspace = true }
solana-address = { workspace = true, features = ["curve25519"] }
solana-commitment-config = { workspace = true }
solana-hash = { workspace = true }
solana-loader-v3-interface = { workspace = true }
solana-message = { workspace = true }
solana-rpc-client = { workspace = true }
solana-rpc-client-api = { workspace = true }
solana-signature = { workspace = true, features = ["verify"] }
solana-transaction = { workspace = true }
solana-transaction-error = { workspace = true }
solana-transaction-status-client-types = { workspace = true }
spr-api = { workspace = true, features = ["reqwest"] }
spr-client = { workspace = true, features = ["solana-rpc"] }
spr-hasher = { workspace = true }
spr-indexer-api = { workspace = true }
spr-interface = { workspace = true }
spr-keypair = { workspace = true }
spr-transaction = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
zeroize = { workspace = true }
zolana-operator-custody = { workspace = true }
zolana-ring-client = { workspace = true, features = ["operations", "solana-rpc"] }
zolana-ring-indexer = { workspace = true }
zolana-ring-transaction = { workspace = true }

[dev-dependencies]
solana-keypair = { workspace = true }
solana-signer = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
