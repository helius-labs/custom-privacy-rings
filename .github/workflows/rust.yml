name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      validation:
        description: Validation scope
        type: choice
        default: full
        options: [full, sanity, sweeps]
      sweeps:
        description: The wide sweeps of validation=sweeps
        type: choice
        default: all
        options: [all, widest frames, full capacity]
      random_seed:
        description: ZOLANA_RANDOM_SEED for every test, decimal or 0x hex
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: "1"
  RUSTFLAGS: "-D warnings"
  NEXTEST_PROFILE: ci
  AGAVE_VERSION: v4.2.2
  SBF_TOOLS_VERSION: v1.54
  NODE_VERSION: "24"
  ZOLANA_RANDOM_SEED: ${{ inputs.random_seed || '0x5eed' }}

jobs:
  # Push and dispatch runs take every path, a draft pull request takes none.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.gate.outputs.rust }}
      ts: ${{ steps.gate.outputs.ts }}
      stack: ${{ steps.gate.outputs.stack }}
      build: ${{ steps.gate.outputs.build }}
      scope: ${{ steps.gate.outputs.scope }}
      localnet_matrix: ${{ steps.localnet.outputs.matrix }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            rust:
              - '**'
              - '!sdk-libs/ts/**'
              - '!package.json'
              - '!package-lock.json'
              - '!docs/**'
              - '!**/*.md'
            ts:
              - 'sdk-libs/ts/**'
              - 'test-vectors/**'
              - 'prover/ring/testdata/**'
              - 'package.json'
              - 'package-lock.json'
              - 'zolana'
              - '.github/**'
            stack:
              - '**'
              - '!program-tests/**'
              - '!docs/**'
              - '!**/*.md'
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          VALIDATION: ${{ inputs.validation }}
          RUST: ${{ steps.filter.outputs.rust }}
          TS: ${{ steps.filter.outputs.ts }}
          STACK: ${{ steps.filter.outputs.stack }}
        run: |
          for name in RUST TS STACK; do
            value="${!name}"
            if [[ "$EVENT" != pull_request ]]; then
              value=true
            elif [[ "$DRAFT" == true ]]; then
              value=false
            fi
            printf -v "$name" '%s' "$value"
            echo "${name,,}=$value" >> "$GITHUB_OUTPUT"
          done
          build=false
          if [[ "$RUST" == true || "$STACK" == true ]]; then build=true; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          scope=full
          if [[ "$EVENT" == workflow_dispatch ]]; then scope="${VALIDATION:-full}"; fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
      - id: localnet
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ steps.gate.outputs.scope }}
          SWEEPS: ${{ inputs.sweeps || 'all' }}
          # The key and withdrawal tests of `shapes` run inside the sweep jobs of the same run.
          LIFECYCLE: not test(shapes::sweep_) and not test(/^shapes::(sanity_.*_keys|(wide|spl)_.*_withdrawals_settle)$/)
          # Each sweep runs its shape loop in `shape_parts` jobs and the phases after it in one more.
          COLUMNS: |
            [
              {"column": "confidential", "shape_parts": 2},
              {"column": "confidential_policy", "shape_parts": 1},
              {"column": "anonymous", "shape_parts": 2},
              {"column": "anonymous_policy", "shape_parts": 3}
            ]
          SUITES: |
            [
              {"name": "delegate and salted shapes", "recipe": "test-custom-ring-validator 'test(=shapes::sweep_delegate) | test(=shapes::sweep_salted)'"},
              {"name": "custom-ring shared sources", "recipe": "test-custom-ring-shared"},
              {"name": "custom-ring policy rules", "recipe": "test-custom-ring-rules"},
              {"name": "custom-ring policy re-pin", "recipe": "test-custom-ring-repin"}
            ]
          # Only a manual dispatch runs these, `validation=sweeps` runs them alone.
          WIDE_SWEEPS: |
            [
              {"name": "widest frames, confidential signer", "recipe": "test-custom-ring-validator 'test(=shapes::sweep_widest_frames_confidential_signer)'", "timeout": 300},
              {"name": "widest frames, confidential in-proof", "recipe": "test-custom-ring-validator 'test(=shapes::sweep_widest_frames_confidential_in_proof)'", "timeout": 300},
              {"name": "widest frames, anonymous", "recipe": "test-custom-ring-validator 'test(=shapes::sweep_widest_frames_anonymous)'", "timeout": 300},
              {"name": "widest frames, anonymous entry", "recipe": "test-custom-ring-validator 'test(=shapes::sweep_widest_frames_anonymous_entry)'", "timeout": 300},
              {"name": "full capacity, confidential", "recipe": "test-custom-ring-validator 'test(=shapes::sweep_full_capacity_confidential)'", "timeout": 300},
              {"name": "full capacity, confidential policy", "recipe": "test-custom-ring-validator 'test(=shapes::sweep_full_capacity_confidential_policy)'", "timeout": 300},
              {"name": "full capacity, anonymous policy", "recipe": "test-custom-ring-validator 'test(=shapes::sweep_full_capacity_anonymous_policy)'", "timeout": 300},
              {"name": "full capacity, salted", "recipe": "test-custom-ring-validator 'test(=shapes::sweep_full_capacity_salted)'", "timeout": 300}
            ]
        run: |
          case "$SCOPE" in
            sanity) jobs='[{"name":"release sanity","recipe":"test-custom-ring-sanity"}]' ;;
            sweeps) jobs="$(jq -c --arg group "$SWEEPS" 'map(select($group == "all" or (.name | startswith($group))))' <<<"$WIDE_SWEEPS")" ;;
            *)
              wide='[]'
              if [[ "$EVENT" == workflow_dispatch ]]; then wide="$WIDE_SWEEPS"; fi
              jobs="$(jq -c -n --arg lifecycle "$LIFECYCLE" --argjson sweeps "$COLUMNS" --argjson suites "$SUITES" --argjson wide "$wide" '
                [range(1; 4) | {name: "custom-ring lifecycle \(.)/3", recipe: "test-custom-ring-validator \u0027\($lifecycle)\u0027 --partition slice:\(.)/3"}]
                + [$sweeps[] | . as $sweep | ($sweep.column | gsub("_"; " ")) as $title
                  | ([range(1; $sweep.shape_parts + 1) | {name: "\($title) shapes \(.)/\($sweep.shape_parts)", part: "\(.)/\($sweep.shape_parts)"}]
                    + [{name: "\($title) keys", part: "keys"}])[]
                  | . + {recipe: "test-custom-ring-validator \u0027test(=shapes::sweep_\($sweep.column))\u0027"}]
                + $suites + $wide')"
              ;;
          esac
          echo "matrix=$(jq -c -n --argjson jobs "$jobs" '{include: $jobs}')" >> "$GITHUB_OUTPUT"

  # The pin may lead zolana main, a release image still needs it on main or release/*.
  zolana-pin:
    name: zolana pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - run: git -C zolana fetch --unshallow --no-tags origin '+refs/heads/*:refs/remotes/origin/*' || true
      - name: The pin is on a zolana branch
        run: |
          branches=$(git -C zolana branch -r --contains HEAD)
          test -n "$branches" || { echo "zolana $(git -C zolana rev-parse HEAD) is on no branch" >&2; exit 1; }
          echo "$branches"
          (cd zolana && tools/check-release-source.sh HEAD) || echo "::warning::the zolana pin is not on main or release/*, no release may be published from it"

  fmt:
    name: rustfmt
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - run: rustup show active-toolchain
      - run: cargo fmt --all -- --check

  machete:
    name: cargo-machete
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          rust: "true"
      - uses: ./.github/actions/install-tools
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete --skip-target-dir cli program-libs program-tests programs sdk-libs services

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-cache: lint
          token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - run: just clippy

  check:
    name: cargo check (workspace)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-cache: lint
          token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - run: just check-all

  test-sdk-libs:
    name: tests / sdk-libs
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-cache: sdk-libs
          token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - run: just test-sdk-libs

  test-program:
    name: tests / custom-ring program
    needs: [changes, programs]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      ZOLANA_PREBUILT: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-cache: program-tests
          token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - uses: ./.github/actions/artifact
        with:
          name: zolana_programs
          mode: restore
      - uses: ./.github/actions/artifact
        with:
          name: ring_program
          mode: restore
      - run: just test-program-fast

  programs:
    name: build / programs
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - id: zolana
        uses: ./.github/actions/artifact
        with:
          name: zolana_programs
          mode: lookup
      - id: ring
        uses: ./.github/actions/artifact
        with:
          name: ring_program
          mode: lookup
      # A push to main installs the tools on a full hit too, its caches are the ones pull requests read.
      - if: steps.zolana.outputs.hit != 'true' || steps.ring.outputs.hit != 'true' || github.event_name == 'push'
        uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-cache: ${{ (steps.zolana.outputs.hit != 'true' || steps.ring.outputs.hit != 'true') && 'programs' || '' }}
          token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
          solana: "true"
          sbf: "true"
      - if: steps.zolana.outputs.hit != 'true'
        run: just build-spp-programs ensure-smart-account
      - uses: ./.github/actions/artifact
        with:
          name: zolana_programs
          mode: save
          cached: ${{ steps.zolana.outputs.hit }}
      - if: steps.ring.outputs.hit != 'true'
        run: just build-ring-program build-zk-ring-program
      - uses: ./.github/actions/artifact
        with:
          name: ring_program
          mode: save
          cached: ${{ steps.ring.outputs.hit }}

  keys:
    name: build / proving keys
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/proving-keys
        with:
          mode: fill

  zolana-tools:
    name: build / zolana cli
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - id: cached
        uses: ./.github/actions/artifact
        with:
          name: zolana_tools
          mode: lookup
      - id: circuits
        uses: ./.github/actions/artifact
        with:
          name: zk_ring_circuits
          mode: lookup
      - if: steps.cached.outputs.hit != 'true' || steps.circuits.outputs.hit != 'true'
        uses: ./.github/actions/setup
        with:
          rust: "true"
          token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - if: steps.cached.outputs.hit != 'true'
        run: just build-zolana-tools ensure-surfpool
      - uses: ./.github/actions/artifact
        with:
          name: zolana_tools
          mode: save
          cached: ${{ steps.cached.outputs.hit }}
      # The zolana cli is in place from the cache or the build above.
      - if: steps.circuits.outputs.hit != 'true'
        run: |
          rustup target add wasm32-unknown-unknown
          just --no-deps build-zk-ring-circuits
          git diff --exit-code -- program-tests/zk-ring-program/src/verifier
      - uses: ./.github/actions/artifact
        with:
          name: zk_ring_circuits
          mode: save
          cached: ${{ steps.circuits.outputs.hit }}

  photon:
    name: build / photon
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - id: cached
        uses: ./.github/actions/artifact
        with:
          name: photon
          mode: lookup
      - if: steps.cached.outputs.hit != 'true'
        uses: ./.github/actions/setup
        with:
          rust: "true"
          token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - if: steps.cached.outputs.hit != 'true'
        run: just build-photon
      - uses: ./.github/actions/artifact
        with:
          name: photon
          mode: save
          cached: ${{ steps.cached.outputs.hit }}

  prover:
    name: build / prover
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - id: cached
        uses: ./.github/actions/artifact
        with:
          name: prover
          mode: lookup
      - if: steps.cached.outputs.hit != 'true'
        uses: ./.github/actions/setup
        with:
          go: "true"
      - if: steps.cached.outputs.hit != 'true'
        run: just build-prover-server
      - uses: ./.github/actions/artifact
        with:
          name: prover
          mode: save
          cached: ${{ steps.cached.outputs.hit }}

  ring-tools:
    name: build / ring tools
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - id: cached
        uses: ./.github/actions/artifact
        with:
          name: ring_tools
          mode: lookup
      - if: steps.cached.outputs.hit != 'true'
        uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-cache: ring-tools
          token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - if: steps.cached.outputs.hit != 'true'
        run: just build-ring-tools build-localnet-archive
      - uses: ./.github/actions/artifact
        with:
          name: ring_tools
          mode: save
          cached: ${{ steps.cached.outputs.hit }}

  ring-proofs:
    name: build / proofs archive
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - id: cached
        uses: ./.github/actions/artifact
        with:
          name: ring_proofs_archive
          mode: lookup
      - if: steps.cached.outputs.hit != 'true'
        uses: ./.github/actions/setup
        with:
          rust: "true"
          rust-cache: ring-tools
          token: ${{ secrets.PRIVATE_LIBS_TOKEN }}
      - if: steps.cached.outputs.hit != 'true'
        run: just build-localnet-proofs-archive
      - uses: ./.github/actions/artifact
        with:
          name: ring_proofs_archive
          mode: save
          cached: ${{ steps.cached.outputs.hit }}

  localnet:
    name: tests / localnet / ${{ matrix.name }}
    needs: [changes, programs, keys, zolana-tools, photon, prover, ring-tools]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 60 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.localnet_matrix) }}
    env:
      ZOLANA_PREBUILT: "1"
      ZOLANA_XTASK_BIN: ${{ github.workspace }}/zolana/target/debug/xtask
      ZOLANA_NEXTEST_ARCHIVE_DIR: target/nextest-archives
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          solana: "true"
          node: "true"
      - uses: ./.github/actions/stack
      - env:
          PART: ${{ matrix.part }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$PART" ]]; then export RING_SWEEP_PART="$PART"; fi
          just ${{ matrix.recipe }}

  # Outside the matrix, no other localnet job waits for the proofs archive.
  localnet-proofs:
    name: tests / localnet / program update
    needs: [changes, programs, keys, zolana-tools, photon, prover, ring-tools, ring-proofs]
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZOLANA_PREBUILT: "1"
      ZOLANA_XTASK_BIN: ${{ github.workspace }}/zolana/target/debug/xtask
      ZOLANA_NEXTEST_ARCHIVE_DIR: target/nextest-archives
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          solana: "true"
          node: "true"
      - uses: ./.github/actions/stack
      - uses: ./.github/actions/artifact
        with:
          name: zk_ring_circuits
          mode: restore
      - uses: ./.github/actions/artifact
        with:
          name: ring_proofs_archive
          mode: restore
      - env:
          GH_TOKEN: ${{ github.token }}
        run: just test-custom-ring-program-update

  ts-check:
    name: typescript / check
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          node: "true"
      - run: npm ci
      - run: npm run check:ts
      - run: npm run docs:ts
      - name: Verify the published package
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          npm pack --workspace @heliuslabs/spr --pack-destination "$tmp"
          npm pack --workspace @heliuslabs/zolana-custom-rings --pack-destination "$tmp"
          set -- "$tmp"/heliuslabs-spr-[0-9]*.tgz
          test "$#" -eq 1
          core="$1"
          set -- "$tmp"/heliuslabs-zolana-custom-rings-*.tgz
          test "$#" -eq 1
          ring="$1"
          printf '{"private":true,"type":"module"}\n' > "$tmp/package.json"
          kit_range="$(node -p "require('./sdk-libs/ts/package.json').peerDependencies['@solana/kit']")"
          npm --prefix "$tmp" install "$core" "$ring" "@solana/kit@$kit_range" --ignore-scripts --before "$(git log -1 --format=%cI)"
          cat > "$tmp/smoke.mts" <<'TS'
          import type { SprClientConfig } from "@heliuslabs/spr";
          import { createCustomRingClient, type RingTransferClient } from "@heliuslabs/zolana-custom-rings";
          const config: Omit<SprClientConfig, "provingKeys"> = { solanaRpcUrl: new URL("http://127.0.0.1:8899") };
          const client: RingTransferClient = await createCustomRingClient(config);
          void client;
          TS
          ./node_modules/.bin/tsc \
            --noEmit --strict --exactOptionalPropertyTypes --skipLibCheck \
            --target es2022 --module nodenext --moduleResolution nodenext \
            "$tmp/smoke.mts"
          (
            cd "$tmp"
            node --input-type=module <<'NODE'
          const ring = await import("@heliuslabs/zolana-custom-rings");
          await Promise.all(
            ["client", "keypair"].map((subpath) => import(`@heliuslabs/zolana-custom-rings/${subpath}`)),
          );
          if (!ring.buildRingTransferTransaction || !ring.buildRingDepositTransaction) process.exit(1);
          await ring.createCustomRingClient({ solanaRpcUrl: "http://127.0.0.1:8899" });
          NODE
          )

  e2e:
    name: typescript / ${{ matrix.name }}
    needs: [changes, programs, keys, zolana-tools, photon, prover, ring-tools]
    if: needs.changes.outputs.stack == 'true' && needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e flows
            recipe: test-ts-e2e
    env:
      ZOLANA_PREBUILT: "1"
      ZOLANA_XTASK_BIN: ${{ github.workspace }}/zolana/target/debug/xtask
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
        with:
          solana: "true"
          node: "true"
      - uses: ./.github/actions/stack
      - run: npm ci
      - env:
          GH_TOKEN: ${{ github.token }}
        run: just ${{ matrix.recipe }}
      - name: Dump service logs on failure
        if: failure()
        run: |
          find target/ts-sdk-e2e -name '*.log' ! -name prover-server.log -print -exec tail -200 {} \; 2>/dev/null || echo "(no logs)"

  result:
    name: ${{ needs.changes.outputs.scope == 'full' && 'ci result' || format('ci {0} result', needs.changes.outputs.scope) }}
    if: always()
    needs:
      - changes
      - zolana-pin
      - fmt
