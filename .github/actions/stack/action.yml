name: Localnet stack
description: Restore the prebuilt localnet stack and the pinned proving keys.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/artifact
      with:
        name: zolana_programs
        mode: restore
    - uses: ./.github/actions/artifact
      with:
        name: ring_program
        mode: restore
    - uses: ./.github/actions/artifact
      with:
        name: zolana_tools
        mode: restore
    - uses: ./.github/actions/artifact
      with:
        name: photon
        mode: restore
    - uses: ./.github/actions/artifact
      with:
        name: prover
        mode: restore
    - uses: ./.github/actions/artifact
      with:
        name: ring_tools
        mode: restore
    - uses: ./.github/actions/proving-keys
      with:
        mode: restore
