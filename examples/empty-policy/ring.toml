# A policy ring with an empty table. Every transfer passes until rules are
# pinned with `zolana-ring policy set`. A ring without a `[policy]` table
# cannot take rules later.

name = "empty-policy"
target = "localnet"
# Set program_id to the program address in the operator manifest.
program_id = "71xpmf2e94nEd9T1S32trTQnhY39xfSUeNW7GH4quTw6"
