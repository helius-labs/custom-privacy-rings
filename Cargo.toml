[workspace]
members = [
    "cli",
    "cli/common",
    "examples/enrollment-vault",
    "program-libs/interface",
    "program-libs/member-registry",
    "program-libs/policy",
    "program-tests/custom-ring",
    "program-tests/zk-ring-program",
    "programs/custom-ring",
    "programs/storage",
    "sdk-libs/client",
    "sdk-libs/indexer",
    "sdk-libs/keys",
    "sdk-libs/operator-custody",
    "sdk-libs/secret-file",
    "sdk-libs/transaction",
    "services/ring-indexer",
    "services/ring-rpc",
    "services/ring-service-core",
    "services/ring-writer",
    "xtask",
]
exclude = ["zolana"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/helius-labs/zolana-custom-rings"

[workspace.metadata.solana]
tools-version = "v1.54"

[workspace.dependencies]
# Ring workspace crates.
custom-ring-interface = { path = "program-libs/interface", version = "0.1.0" }
zolana-ring-policy = { path = "program-libs/policy", version = "0.1.0" }
zolana-ring-member-registry = { path = "program-libs/member-registry", version = "0.1.0" }
zolana-operator-custody = { path = "sdk-libs/operator-custody" }
zolana-secret-file = { path = "sdk-libs/secret-file", version = "0.1.0" }
zolana-cli-common = { path = "cli/common" }
zolana-ring-indexer = { path = "sdk-libs/indexer", version = "0.1.0" }
zolana-ring-keys = { path = "sdk-libs/keys", version = "0.1.0" }
zolana-ring-client = { path = "sdk-libs/client", version = "0.1.0" }
zolana-ring-transaction = { path = "sdk-libs/transaction", version = "0.1.0" }
custom-ring-cli = { path = "cli", version = "0.1.0" }
zolana-ring-rpc = { path = "services/ring-rpc", version = "0.1.0" }
ring-service-core = { path = "services/ring-service-core", version = "0.1.0" }
ring-writer = { path = "services/ring-writer", version = "0.1.0" }

# Solana platform-tools Cargo 1.84 cannot build edition2024 crates pulled by
# newer time-core releases.
time = ">=0.3, <0.3.46"

# zolana crates through the submodule.
spr-event = { path = "zolana/program-libs/event", version = "0.10.0" }
spr-event-parser = { path = "zolana/sdk-libs/event", version = "0.10.0" }
spr-interface = { path = "zolana/program-libs/interface", version = "0.10.0" }
spr-user-registry-interface = { path = "zolana/program-libs/user-registry-interface", version = "0.10.0" }
spr-tree = { path = "zolana/program-libs/tree", version = "0.10.0" }
spr-keypair = { path = "zolana/sdk-libs/keypair", version = "0.10.0" }
spr-instruction = { path = "zolana/sdk-libs/instruction", version = "0.10.0" }
spr-program = { path = "zolana/sdk-libs/program", version = "0.10.0", default-features = false }
spr-protocol-instructions = { path = "zolana/protocol-ops/instructions", version = "0.10.0" }
spr-api = { path = "zolana/sdk-libs/spr-api", version = "0.10.0", default-features = false }
spr-program-test = { path = "zolana/sdk-libs/program-test", version = "0.10.0" }
spr-transaction = { path = "zolana/sdk-libs/transaction", version = "0.10.0" }
spr-client = { path = "zolana/sdk-libs/client", version = "0.10.0" }
spr-indexer-api = { path = "zolana/sdk-libs/indexer-api", version = "0.10.0" }
spr-test-utils = { path = "zolana/program-tests/test-utils", version = "0.1.0" }
spr-rpc-http = { path = "zolana/services/rpc-http", version = "0.1.0" }
groth16-solana = { version = "0.3.1", features = ["bsb22"] }

spr-account-checks = { path = "zolana/program-libs/account-checks", version = "0.10.0", default-features = false }
spr-hasher = { path = "zolana/program-libs/hasher", version = "0.8.0", default-features = false }

# Solana and SPL.
borsh = { version = "1.5", default-features = false, features = ["derive"] }
solana-account = "4.3"
solana-account-decoder-client-types = "4.1"
solana-address = { version = "2.7", features = ["atomic", "borsh", "bytemuck", "copy", "decode", "wincode"] }
solana-bn254 = "3.2.1"
solana-clock = "3.0"
solana-commitment-config = "3.1"
solana-hash = "4.6"
solana-instruction = "3.4"
solana-instruction-error = "2.4"
solana-keypair = "3.1.2"
solana-loader-v3-interface = "8.1"
solana-message = "4.2"
solana-packet = "3.0"
solana-program-error = "3.0"
# 4.1 encodes VersionedTransaction with serde: signatures, then the message.
# A v1 transaction's wire format is the message, then a raw signature array,
# and those swapped bytes are rejected with "invalid transaction config mask".
# 4.2 encodes with wincode, which writes v1 in wire order.
solana-rpc-client = "4.2"
solana-rpc-client-api = "4.2"
solana-sbpf = { version = "0.23", default-features = false }
solana-security-txt = "1.1.2"
solana-sdk-ids = "3.1"
solana-signature = "3.4"
solana-signer = "3.0"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-transaction = "4.1"
solana-transaction-error = "3.0"
solana-transaction-status-client-types = "4.1"
spl-token-2022-interface = "2.0"
pinocchio = "0.11"
pinocchio-system = "0.6.0"

# Async, HTTP, logging, and utilities.
aes-gcm = "0.10"
anyhow = "1.0"
async-trait = "0.1.82"
arrayvec = "0.7"
base64 = "0.22.1"
bincode = { version = "2.0.1", features = ["serde"] }
bs58 = "0.5.1"
bytemuck = { version = "1.19.0", features = ["derive"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
five8 = "1.0.0"
futures = "0.3.31"
hex = "0.4"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
libc = "0.2"
http-body-util = "0.1.3"
http = "1"
hyper = "1.10.1"
hyper-util = { version = "0.1.20", features = ["server-auto", "tokio"] }
jsonrpsee = { version = "0.26.0", features = ["server", "macros"] }
log = "0.4"
litesvm = "0.18"
num-bigint = "0.4.6"
rand = "0.8.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sea-orm = { version = "1.1.20", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3"
sha2 = "0.10"
thiserror = { version = "2.0", default-features = false }
toml = "0.8"
toml_edit = "0.22"
tokio = { version = "1.48.0", features = ["rt", "macros", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", default-features = false, features = ["cors"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }

# Client keypair crypto.
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
psl = "2"
ed25519-dalek = "2.2.0"
aes = { version = "0.8", default-features = false }
ctr = { version = "0.9", default-features = false }
hkdf = "0.12"
percent-encoding = "2.3"
zeroize = "1"
subtle = "2.6"
# HSM custody backends exercised by the keypair test suite.
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-mocks = "0.3"
proptest = "1"
wincode = { version = "0.6", default-features = false, features = ["derive", "alloc"] }

[profile.dev]
opt-level = 0
debug = "line-tables-only"
strip = "none"

[profile.dev.package.syn]
opt-level = 3

[profile.dev.package.proc-macro2]
opt-level = 3

[profile.dev.package.quote]
opt-level = 3

[profile.dev.package.serde_derive]
opt-level = 3

[profile.dev.package.ark-ff-macros]
opt-level = 3

[profile.dev.package.ark-ff-asm]
opt-level = 3

[profile.dev.package.p256]
opt-level = 3

[profile.dev.package.primeorder]
opt-level = 3

[profile.dev.package.elliptic-curve]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.hmac]
opt-level = 3

[profile.dev.package.hkdf]
opt-level = 3

[profile.dev.package.aes]
opt-level = 3

[profile.dev.package.ark-ff]
opt-level = 3

[profile.dev.package.ark-bn254]
opt-level = 3

[profile.dev.package.light-poseidon]
opt-level = 3

[profile.release]
overflow-checks = true

# Share the local hasher with the ZK crates.
[patch.crates-io]
spr-hasher = { path = "zolana/program-libs/hasher" }
