[package]
name = "custom-ring-interface"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = ["verifying-keys"]
verifying-keys = []
cpi = ["dep:pinocchio"]

[dependencies]
pinocchio = { workspace = true, optional = true, features = ["cpi"] }
arrayvec = { workspace = true }
# Required for Pod on the compressed auditor key.
bytemuck = { workspace = true, features = ["extern_crate_alloc", "min_const_generics"] }
five8 = { workspace = true }
groth16-solana = { workspace = true }
solana-address = { workspace = true, features = ["bytemuck", "curve25519"] }
solana-program-error = { workspace = true }
spl-token-2022-interface = { workspace = true }
thiserror = { workspace = true }
wincode = { workspace = true }
zolana-ring-policy = { workspace = true }
spr-hasher = { workspace = true }
spr-interface = { workspace = true }
spr-event = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
x25519-dalek = { workspace = true }
